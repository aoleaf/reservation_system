# 本番の nginx（前に Caddy がいて HTTPS はそこで受ける。nginx は外に出さない）
server {
    listen 80;
    root /var/www/html/public;
    index index.php;
    server_tokens off;
    client_max_body_size 4m;

    # ビルドした画面のファイル（名前にハッシュが入るので、長く持たせてよい）
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public$fastcgi_script_name;
        include fastcgi_params;
    }

    # .env などの隠しファイルは返さない
    location ~ /\.(?!well-known) {
        deny all;
    }
}
