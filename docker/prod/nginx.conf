# 本番の nginx（前に Caddy がいて HTTPS はそこで受ける。nginx は外に出さない）
server {
    listen 80;
    root /var/www/html/public;
    index index.php;
    server_tokens off;
    client_max_body_size 4m;

    # app の IP は Docker の DNS で毎回引き直す（10秒だけ覚える）。
    # .env を変えて docker compose up -d すると app だけ作り直されて IP が変わるので、
    # 起動したときの IP を覚えたままだと、古い IP に送り続けて 502 になる。
    # fastcgi_pass に変数を使うと、nginx は起動のときではなく、送るときに名前を引く
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;
    set $php_upstream app:9000;

    # ビルドした画面のファイル（名前にハッシュが入るので、長く持たせてよい）
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass $php_upstream;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public$fastcgi_script_name;
        include fastcgi_params;
    }

    # .env などの隠しファイルは返さない
    location ~ /\.(?!well-known) {
        deny all;
    }
}
