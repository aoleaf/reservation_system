# 本番用のイメージを作り、GitHub のレジストリ（GHCR）に置く。サーバーはこれを取ってくるだけ（サーバーではビルドしない）。
# main にマージしたとき（と、手で動かしたとき）に作る。タグは latest とコミットの SHA（前の版に戻すときに使う）。
name: image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # イメージの名前は小文字でないといけない
      - name: イメージの名前
        run: echo "PREFIX=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: app（PHP）
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/prod/Dockerfile
          target: app
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.PREFIX }}-app:latest
            ${{ env.PREFIX }}-app:${{ github.sha }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app

      - name: web（nginx）
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/prod/Dockerfile
          target: web
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.PREFIX }}-web:latest
            ${{ env.PREFIX }}-web:${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
