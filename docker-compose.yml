services:
  app:
    build: ./docker/php
    user: "${UID:-1000}:${GID:-1000}"   # WSLのユーザーと揃える＝権限の問題を防ぐ
    volumes: [".:/var/www/html"]
  nginx:
    image: nginx:alpine
    ports: ["8080:80"]
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on: [app]
  # キューのワーカー（予約確認・キャンセル受付などのメールを送る）
  queue:
    build: ./docker/php
    user: "${UID:-1000}:${GID:-1000}"
    volumes: [".:/var/www/html"]
    command: php artisan queue:work --tries=3 --backoff=30
    restart: unless-stopped
    depends_on: [app]
  # スケジューラー（期限切れの仮押さえを毎分戻す・毎月1日に枠を作る）
  scheduler:
    build: ./docker/php
    user: "${UID:-1000}:${GID:-1000}"
    volumes: [".:/var/www/html"]
    command: php artisan schedule:work
    restart: unless-stopped
    depends_on: [app]
  # 本番と同じ MySQL（.env の DB_CONNECTION=mysql・DB_HOST=db で使う）
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: tsuchinone
      MYSQL_USER: tsuchinone
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: secret
    ports: ["3306:3306"]
    volumes: ["db-data:/var/lib/mysql"]
volumes:
  db-data:
