services:
  app:
    build: ./docker/php
    user: "${UID:-1000}:${GID:-1000}"   # WSLのユーザーと揃える＝権限の問題を防ぐ
    volumes: [".:/var/www/html"]
  nginx:
    image: nginx:alpine
    ports: ["8080:80"]
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on: [app]