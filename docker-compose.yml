services:
  app:
    build: ./docker/php
    user: "${UID:-1000}:${GID:-1000}"   # WSLのユーザーと揃える＝権限の問題を防ぐ
    volumes: [".:/var/www/html"]
  nginx:
    image: nginx:alpine
    ports: ["8080:80"]
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on: [app]
  # 本番と同じ MySQL（.env の DB_CONNECTION=mysql・DB_HOST=db で使う）
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: tsuchinone
      MYSQL_USER: tsuchinone
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: secret
    ports: ["3306:3306"]
    volumes: ["db-data:/var/lib/mysql"]
volumes:
  db-data:
